name: CI - DevOps AI Tool

on:
  push:
    branches:
      - ci-branch
  pull_request:
    branches:
      - ci-branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 18 with npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Step 3: Install dependencies
      # Use npm install if package-lock.json might not exist yet
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Step 4: Run tests
      - name: Run tests
        run: npm test

  # Optional Docker build job
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-ai-tool:${{ github.sha }} .